sources:
  - name: iasworld
    # Source tags defined under the `config` block don't propagate to data tests
    # due to a dbt bug. This is important for the `data_test_iasworld` tag,
    # since we use that tag to filter tests, so we must define the tag under the
    # top-level `tags` key. See this dbt bug report for more details:
    # https://github.com/dbt-labs/dbt/issues/16347
    tags:
      - data_test_iasworld
    config:
      loaded_at_field: date_parse(loaded_at, '%Y-%m-%d %H:%i:%S.%f')
      tags:
        - load_auto

    tables:
      - name: enter
        description: '{{ doc("table_enter") }}'
        config:
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

        columns:
          - name: cur
            description: '{{ doc("column_cur") }}'
          - name: deactivat
            description: '{{ doc("column_deactivat") }}'
          - name: entercd
            description: Entrance code
          - name: enterdt
            description: Entrance date
          - name: enterid
            description: ID of person making inspection
          - name: enterinfo
            description: Entrance information code
          - name: iasw_id
            description: '{{ doc("column_iasw_id") }}'
          - name: jur
            description: '{{ doc("column_jur") }}'
          - name: loaded_at
            description: '{{ doc("shared_column_loaded_at") }}'
          - name: parid
            description: '{{ doc("shared_column_pin") }}'
          - name: seq
            description: '{{ doc("shared_column_seq") }}'
          - name: trans_id
            description: '{{ doc("column_trans_id") }}'
          - name: upd_status
            description: '{{ doc("column_upd_status") }}'
          - name: wen
            description: '{{ doc("shared_column_updated_at") }}'
          - name: who
            description: '{{ doc("shared_column_updated_by") }}'
