sources:
  - name: iasworld
    # Source tags defined under the `config` block don't propagate to data tests
    # due to a dbt bug. This is important for the `data_test_iasworld` tag,
    # since we use that tag to filter tests, so we must define the tag under the
    # top-level `tags` key. See this dbt bug report for more details:
    # https://github.com/dbt-labs/dbt/issues/16347
    tags:
      - data_test_iasworld
    config:
      loaded_at_field: date_parse(loaded_at, '%Y-%m-%d %H:%i:%S.%f')
      tags:
        - load_auto

    tables:
      - name: dedit
        description: '{{ doc("table_dedit") }}'
        config:
          freshness:
            warn_after: {count: 192, period: hour} # 8 days
            error_after: {count: 360, period: hour} # 15 days

        columns:
          - name: fld1
            description: Column name of edit field 1
          - name: fld2
            description: Column name of edit field 2
          - name: iasw_id
            description: '{{ doc("column_iasw_id") }}'
          - name: loaded_at
            description: '{{ doc("shared_column_loaded_at") }}'
          - name: longdesc
            description: Long description
          - name: msg
            description: Message associated with this pair of values
          - name: shortdesc
            description: Short description
          - name: tbl1
            description: Table name of edit field 1
          - name: tbl2
            description: Table name of edit field 2
          - name: val1
            description: Value 1
          - name: val2
            description: Value in edit field 2
          - name: wen
            description: '{{ doc("shared_column_updated_at") }}'
          - name: who
            description: '{{ doc("shared_column_updated_by") }}'
