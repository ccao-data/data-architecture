sources:
  - name: iasworld
    # Source tags defined under the `config` block don't propagate to data tests
    # due to a dbt bug. This is important for the `data_test_iasworld` tag,
    # since we use that tag to filter tests, so we must define the tag under the
    # top-level `tags` key. See this dbt bug report for more details:
    # https://github.com/dbt-labs/dbt/issues/16347
    tags:
      - data_test_iasworld
    config:
      loaded_at_field: date_parse(loaded_at, '%Y-%m-%d %H:%i:%S.%f')
      tags:
        - load_auto

    tables:
      - name: permit
        description: '{{ doc("table_permit") }}'
        config:
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

        columns:
          - name: addrvalid
            description: '{{ doc("column_addrvalid") }}'
          - name: adradd
            description: '{{ doc("column_adradd") }}'
          - name: adrdir
            description: '{{ doc("column_adrdir") }}'
          - name: adrno
            description: '{{ doc("column_adrno") }}'
          - name: adrstr
            description: '{{ doc("column_adrstr") }}'
          - name: adrsuf
            description: '{{ doc("column_adrsuf") }}'
          - name: adrsuf2
            description: '{{ doc("column_adrsuf2") }}'
          - name: amount
            description: Amount
          - name: certdate
            description: Certified date
          - name: cur
            description: '{{ doc("column_cur") }}'
          - name: deactivat
            description: '{{ doc("column_deactivat") }}'
          - name: drawndt
            description: Date plans were drawn
          - name: flag
            description: Flag
          - name: iasw_id
            description: '{{ doc("column_iasw_id") }}'
          - name: id1
            description: ID field 1
          - name: id2
            description: ID field 2
          - name: jur
            description: '{{ doc("column_jur") }}'
          - name: loaded_at
            description: '{{ doc("shared_column_loaded_at") }}'
          - name: longdesc
            description: Long description
          - name: note2
            description: Mailing address
          - name: notes
            description: Permit notes
          - name: num
            description: Number
          - name: parid
            description: '{{ doc("shared_column_pin") }}'
          - name: permdt
            description: Permit date
          - name: seq
            description: '{{ doc("shared_column_seq") }}'
          - name: trans_id
            description: '{{ doc("column_trans_id") }}'
          - name: upd_status
            description: '{{ doc("column_upd_status") }}'
          - name: wen
            description: '{{ doc("shared_column_updated_at") }}'
          - name: who
            description: '{{ doc("shared_column_updated_by") }}'
